<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AL HASSAN - لوحة التحكم</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 15px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
    }

    .refresh {
      background: #111;
      color: white;
    }

    .order {
      background: white;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .order h3 {
      margin-top: 0;
    }

    .info {
      line-height: 1.8;
      margin-bottom: 12px;
    }

    .status {
      font-weight: bold;
      margin: 10px 0;
    }

    .status-buttons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .status-buttons button {
      background: #eee;
    }

    .status-buttons button:hover {
      background: #ddd;
    }

    .message {
      text-align: center;
      padding: 30px;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>

<header>
  <h1>AL HASSAN</h1>
  <div>لوحة إدارة الطلبات</div>
</header>

<div class="container">

  <div class="top">
    <h2>الطلبات</h2>
    <button class="refresh" id="refreshBtn">🔄 تحديث</button>
  </div>

  <div id="orders"></div>

</div>

<script type="module">

  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    collection,
    getDocs,
    query,
    orderBy,
    doc,
    updateDoc
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB5hMTYH6I6Z_Ij4VYdVsvaWAaiLt9SRA",
    authDomain: "al-hassan-b39d6.firebaseapp.com",
    projectId: "al-hassan-b39d6",
    storageBucket: "al-hassan-b39d6.firebasestorage.app",
    messagingSenderId: "239416840375",
    appId: "1:239416840375:web:804d0308ce3d7afee97d32",
    measurementId: "G-6C86NGWQCS"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const ordersDiv = document.getElementById("orders");
  const refreshBtn = document.getElementById("refreshBtn");

  function statusText(status) {
    if (status === "new") return "🆕 جديد";
    if (status === "preparing") return "🔄 قيد التنفيذ";
    if (status === "on_the_way") return "🚚 بالطريق";
    if (status === "delivered") return "✅ تم التوصيل";
    return "🆕 جديد";
  }

  function formatDate(timestamp) {
    if (!timestamp) return "الآن";

    const date = timestamp.toDate();

    return date.toLocaleString("ar-LB", {
      dateStyle: "medium",
      timeStyle: "short"
    });
  }

  async function changeStatus(orderId, newStatus) {

    try {

      await updateDoc(
        doc(db, "orders", orderId),
        {
          status: newStatus
        }
      );

      alert("تم تحديث حالة الطلب ✅");

      loadOrders();

    } catch (error) {

      console.error(error);

      alert("حدث خطأ أثناء تحديث حالة الطلب");

    }
  }

  async function loadOrders() {

    ordersDiv.innerHTML = '<div class="message">جاري تحميل الطلبات...</div>';

    try {

      const ordersQuery = query(
        collection(db, "orders"),
        orderBy("createdAt", "desc")
      );

      const snapshot = await getDocs(ordersQuery);

      if (snapshot.empty) {
        ordersDiv.innerHTML =
          '<div class="message">لا توجد طلبات حاليًا.</div>';
        return;
      }

      ordersDiv.innerHTML = "";

      snapshot.forEach((orderDoc) => {

        const order = orderDoc.data();

        const card = document.createElement("div");
        card.className = "order";

        card.innerHTML = `
          <h3>📦 طلب</h3>

          <div class="info">
            <strong>الشيء:</strong> ${order.item || ""}<br>
            <strong>العنوان:</strong> ${order.address || ""}<br>
            <strong>الهاتف:</strong> ${order.phone || ""}<br>
            <strong>ملاحظات:</strong> ${order.notes || "لا يوجد"}<br>
            <strong>الوقت:</strong> ${formatDate(order.createdAt)}
          </div>

          <div class="status">
            الحالة الحالية:
            ${statusText(order.status)}
          </div>

          <div class="status-buttons">

            <button data-status="new">
              🆕 جديد
            </button>

            <button data-status="preparing">
              🔄 قيد التنفيذ
            </button>

            <button data-status="on_the_way">
              🚚 بالطريق
            </button>

            <button data-status="delivered">
              ✅ تم التوصيل
            </button>

          </div>
        `;

        const buttons = card.querySelectorAll("[data-status]");

        buttons.forEach((button) => {

          button.addEventListener("click", () => {

            changeStatus(
              orderDoc.id,
              button.dataset.status
            );

          });

        });

        ordersDiv.appendChild(card);

      });

    } catch (error) {

      console.error(error);

      ordersDiv.innerHTML =
        '<div class="message error">حدث خطأ أثناء تحميل الطلبات</div>';

    }
  }

  refreshBtn.addEventListener("click", loadOrders);

  loadOrders();

</script>

</body>
</html>

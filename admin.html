<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>AL HASSAN - الإدارة</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #e30613;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 5px;
      font-size: 25px;
    }

    header p {
      margin: 0;
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .top h2 {
      margin: 0;
    }

    #refreshBtn {
      border: none;
      background: #e30613;
      color: white;
      padding: 10px 15px;
      border-radius: 9px;
      cursor: pointer;
    }

    .order {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px #ddd;
    }

    .order h3 {
      margin-top: 0;
      color: #e30613;
    }

    .order p {
      margin: 8px 0;
      line-height: 1.5;
    }

    .status {
      display: inline-block;
      background: #fff3cd;
      color: #856404;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 5px;
    }

    #loading {
      text-align: center;
      padding: 30px;
    }

    #empty {
      display: none;
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      color: #777;
    }

    .error {
      background: #ffe5e5;
      color: #b00000;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

  </style>

</head>


<body>


  <header>

    <h1>
      AL HASSAN
    </h1>

    <p>
      لوحة إدارة الطلبات
    </p>

  </header>


  <div class="container">


    <div class="top">

      <h2>
        📦 الطلبات
      </h2>

      <button id="refreshBtn">
        🔄 تحديث
      </button>

    </div>


    <div id="loading">
      جاري تحميل الطلبات...
    </div>


    <div id="empty">
      لا يوجد طلبات حاليًا 📭
    </div>


    <div id="orders"></div>


  </div>


  <script type="module">


    import { initializeApp }

    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {

      getFirestore,

      collection,

      getDocs,

      query,

      orderBy

    }

    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyB5hMTyYH6I6Z_Ij4VYdVsvaWAaiLt9SRA",

      authDomain:
        "al-hassan-b39d6.firebaseapp.com",

      projectId:
        "al-hassan-b39d6",

      storageBucket:
        "al-hassan-b39d6.firebasestorage.app",

      messagingSenderId:
        "239416840375",

      appId:
        "1:239416840375:web:804d0308ce3d7afee97d32",

      measurementId:
        "G-6C86NGWQCS"

    };


    const app =
      initializeApp(firebaseConfig);


    const db =
      getFirestore(app);


    const ordersContainer =
      document.getElementById("orders");


    const loading =
      document.getElementById("loading");


    const empty =
      document.getElementById("empty");


    async function loadOrders() {


      ordersContainer.innerHTML = "";

      loading.style.display = "block";

      empty.style.display = "none";


      try {


        const ordersQuery = query(

          collection(db, "orders"),

          orderBy("createdAt", "desc")

        );


        const snapshot =
          await getDocs(ordersQuery);


        loading.style.display = "none";


        if (snapshot.empty) {

          empty.style.display = "block";

          return;

        }


        snapshot.forEach((doc) => {


          const order =
            doc.data();


          const orderBox =
            document.createElement("div");


          orderBox.className =
            "order";


          let time = "";


          if (order.createdAt) {

            time =
              order.createdAt
                .toDate()
                .toLocaleString("ar");

          }


          orderBox.innerHTML = `

            <h3>
              🚚 طلب جديد
            </h3>

            <p>
              🛒 <strong>الطلب:</strong>
              ${order.item || ""}
            </p>

            <p>
              📍 <strong>العنوان:</strong>
              ${order.address || ""}
            </p>

            <p>
              📞 <strong>الهاتف:</strong>
              ${order.phone || ""}
            </p>

            ${
              order.notes
              ?
              `
              <p>
                📝 <strong>ملاحظات:</strong>
                ${order.notes}
              </p>
              `
              :
              ""
            }

            <p>
              🕐 <strong>وقت الطلب:</strong>
              ${time}
            </p>

            <span class="status">
              ${order.status || "new"}
            </span>

          `;


          ordersContainer.appendChild(
            orderBox
          );


        });


      }


      catch (error) {


        console.error(error);


        loading.style.display = "none";


        ordersContainer.innerHTML = `

          <div class="error">

            ❌ حدث خطأ أثناء تحميل الطلبات.

          </div>

        `;


      }


    }


    document
      .getElementById("refreshBtn")
      .addEventListener(
        "click",
        loadOrders
      );


    loadOrders();


  </script>


</body>

</html>

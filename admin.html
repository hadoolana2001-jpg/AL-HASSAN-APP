<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AL HASSAN - الإدارة</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
  padding-bottom:30px;
}

header{
  background:#e30613;
  color:white;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:5;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.wrap{
  max-width:800px;
  margin:auto;
  padding:16px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:15px;
}

.stat{
  background:white;
  border-radius:14px;
  padding:15px;
  text-align:center;
  box-shadow:0 2px 7px #ddd;
}

.stat b{
  display:block;
  font-size:24px;
  color:#e30613;
}

.filters{
  background:white;
  padding:12px;
  border-radius:14px;
  margin-bottom:15px;
  box-shadow:0 2px 7px #ddd;
}

.filters select{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
}

.order{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 2px 7px #ddd;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.type{
  font-weight:bold;
  color:#e30613;
}

.date{
  font-size:11px;
  color:#777;
}

.detail{
  line-height:1.8;
  margin:10px 0;
}

.order select{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-top:8px;
}

.save{
  width:100%;
  border:0;
  background:#e30613;
  color:white;
  padding:11px;
  border-radius:10px;
  margin-top:8px;
  font-weight:bold;
}

.msg{
  text-align:center;
  padding:10px;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#777;
  padding:35px;
}

@media(max-width:500px){

  .stats{
    grid-template-columns:repeat(3,1fr);
  }

  .stat{
    font-size:12px;
    padding:10px;
  }

  .stat b{
    font-size:20px;
  }

}
</style>
</head>

<body>

<header>

<div class="logo">
AL HASSAN 🛵
</div>

<div>
لوحة الإدارة
</div>

</header>

<div class="wrap">

<div class="stats">

<div class="stat">
<b id="newCount">0</b>
جديد
</div>

<div class="stat">
<b id="activeCount">0</b>
قيد التنفيذ
</div>

<div class="stat">
<b id="doneCount">0</b>
تم التسليم
</div>

</div>

<div class="filters">

<select id="filter" onchange="loadOrders()">

<option value="all">
كل الطلبات
</option>

<option value="new">
🆕 جديد
</option>

<option value="preparing">
🔄 قيد التنفيذ
</option>

<option value="purchased">
🛍️ تم الشراء
</option>

<option value="onway">
🛵 بالطريق
</option>

<option value="delivered">
✅ تم التسليم
</option>

</select>

</div>

<div id="message" class="msg"></div>

<div id="orders">

<div class="empty">
جارِ تحميل الطلبات...
</div>

</div>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
updateDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyB5hMTyYH6I6Z_Ij4VYdVsvaWAaiLt9SRA",

authDomain:
"al-hassan-b39d6.firebaseapp.com",

projectId:
"al-hassan-b39d6",

storageBucket:
"al-hassan-b39d6.firebasestorage.app",

messagingSenderId:
"239416840375",

appId:
"1:239416840375:web:804d0308ce3d7afee97d32",

measurementId:
"G-6C86NGWQCS"

};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);


const names={

food:"🍔 مطعم",

market:"🛒 سوبرماركت",

pharmacy:"💊 صيدلية",

clothes:"👗 ملابس",

beauty:"💄 تجميل",

electronics:"📱 إلكترونيات",

gifts:"🎁 هدايا",

other:"🏪 محل آخر"

};


const statuses={

new:"🆕 جديد",

preparing:"🔄 قيد التنفيذ",

purchased:"🛍️ تم الشراء",

onway:"🛵 بالطريق",

delivered:"✅ تم التسليم"

};


window.loadOrders=async function(){

const box=document.getElementById("orders");

box.innerHTML=
'<div class="empty">جارِ تحميل الطلبات...</div>';

try{

const snap=
await getDocs(
collection(db,"orders")
);

let rows=[];

let n=0;

let a=0;

let d=0;


snap.forEach(x=>{

const o=x.data();

if(o.status==="new")
n++;

if(
["preparing","purchased","onway"]
.includes(o.status)
)
a++;

if(o.status==="delivered")
d++;

rows.push({
id:x.id,
...o
});

});


document.getElementById("newCount").innerText=n;

document.getElementById("activeCount").innerText=a;

document.getElementById("doneCount").innerText=d;


const filter=
document.getElementById("filter").value;


if(filter!=="all"){

rows=
rows.filter(
o=>o.status===filter
);

}


rows.reverse();


if(!rows.length){

box.innerHTML=
'<div class="empty">لا توجد طلبات بهذا التصنيف 📦</div>';

return;

}


box.innerHTML="";


rows.forEach(o=>{

const type=
names[o.category]||"🛵 طلب";

const status=
o.status||"new";


box.innerHTML+=`

<div class="order">

<div class="top">

<div class="type">
${type}
</div>

<div class="date">
${
o.createdAt?.toDate
?
o.createdAt.toDate()
.toLocaleString("ar-SY")
:
""
}
</div>

</div>


<div class="detail">

<b>
${o.item||"طلب"}
</b>

<br>

📍 ${o.address||""}

<br>

📞 ${o.phone||""}

${o.merchant
?
"<br>🏪 "+o.merchant
:
""}

${o.notes
?
"<br>📝 "+o.notes
:
""}

</div>


<select id="status-${o.id}">

${
Object.entries(statuses)
.map(
([k,v])=>
`
<option
value="${k}"
${k===status?"selected":""}
>
${v}
</option>
`
)
.join("")
}

</select>


<button
class="save"
onclick="saveStatus('${o.id}')"
>
حفظ حالة الطلب
</button>

</div>

`;

});


}catch(e){

console.error(e);

box.innerHTML=
'<div class="empty">تعذر تحميل الطلبات.</div>';

}

};


window.saveStatus=async function(id){

const value=
document
.getElementById("status-"+id)
.value;


try{

await updateDoc(
doc(db,"orders",id),
{
status:value
}
);


document.getElementById("message")
.innerText=
"✅ تم تحديث حالة الطلب";


setTimeout(
()=>{
document.getElementById("message")
.innerText="";
},
1800
);


loadOrders();


}catch(e){

console.error(e);

document.getElementById("message")
.innerText=
"❌ تعذر تحديث الطلب";

}

};


loadOrders();

</script>

</body>
</html>
